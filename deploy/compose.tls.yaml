# Switch the existing ingress to automatically managed HTTPS on one domain.
# Combine with compose.yaml. Add compose.build.yaml as well for local source builds.
services:
  web:
    environment:
      APP_URL: https://${DOCKYARD_DOMAIN:?Set DOCKYARD_DOMAIN in .env}
  registry:
    environment:
      REGISTRY_AUTH_TOKEN_REALM: https://${DOCKYARD_DOMAIN:?Set DOCKYARD_DOMAIN in .env}/api/registry/token
  ingress:
    environment:
      INGRESS_PUBLIC_URL: https://${DOCKYARD_DOMAIN:?Set DOCKYARD_DOMAIN in .env}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data

volumes:
  caddy_data:
