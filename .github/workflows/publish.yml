name: Publish Dockyard images

on:
  workflow_call:
    inputs:
      ref:
        description: Exact tested source commit
        type: string
        required: true
      version:
        description: Stable SemVer, without v; empty for a development build
        type: string
        default: ""
      edge:
        description: Update the development edge tag
        type: boolean
        default: false
      aliases:
        description: Update latest and major/minor release aliases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [init, migrate, web, ingress]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check release version and registry credentials
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_USERNAME" && test -n "$DOCKER_PASSWORD" || { echo "Set DOCKER_USERNAME and DOCKER_PASSWORD secrets in the release environment" >&2; exit 1; }
          node -e 'const version = process.env.RELEASE_VERSION; if (version && (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || require("./package.json").version !== version)) throw new Error("Release version must match package.json")'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the Dockyard registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: cr.guneet.dev
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Image tags and OCI metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: cr.guneet.dev/dockyard/${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable=${{ inputs.edge }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.aliases && inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.aliases && inputs.version != '' && !startsWith(inputs.version, '0.') }}
            type=raw,value=latest,enable=${{ inputs.aliases && inputs.version != '' }}
          labels: |
            org.opencontainers.image.title=Dockyard ${{ matrix.target }}
      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dockyard-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=dockyard-${{ matrix.target }}
          provenance: mode=min
          sbom: true
      - name: Record the published digest
        env:
          IMAGE: cr.guneet.dev/dockyard/${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $IMAGE"
            echo "Digest: \`$DIGEST\`"
            echo '```text'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
