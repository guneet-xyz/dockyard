name: Release and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to republish (e.g. v0.1.0); empty runs the normal release flow
        type: string
        required: false
        default: ""
      update_latest:
        description: Also move latest and major/minor aliases when republishing an existing release
        type: boolean
        default: false

permissions:
  contents: read

# Do not cancel a publication halfway through the four-image release.
concurrency:
  group: dockyard-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'guneet-xyz/dockyard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      edge: ${{ steps.source.outputs.edge }}
      aliases: ${{ steps.source.outputs.aliases }}
    steps:
      - name: Maintain the conventional-commit release PR and create merged releases
        if: inputs.release_tag == ''
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows. Explicit
      # workflow_dispatch does trigger CI, without requiring a third/PAT secret.
      - name: Dispatch quality checks for the generated release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          branch=$(node -e 'const prs = JSON.parse(process.env.RELEASE_PRS); if (prs.length !== 1 || !prs[0].headBranchName) throw new Error("Expected one release PR"); console.log(prs[0].headBranchName)')
          gh workflow run ci.yml --ref "$branch"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the exact source commit and publication tags
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SOURCE_SHA: ${{ github.sha }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -euo pipefail
          tag=""
          sha="$SOURCE_SHA"
          aliases=false
          edge=true
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
            edge=false
            aliases="$UPDATE_LATEST"
          elif [ "$RELEASE_CREATED" = true ]; then
            tag="$RELEASE_TAG"
            sha="$RELEASE_SHA"
            aliases=true
            # Release Please may find a merged release older than this push.
            # Never label that older source as the current main development build.
            if [ "$sha" != "$SOURCE_SHA" ]; then edge=false; fi
          fi
          version=""
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Expected a stable vMAJOR.MINOR.PATCH release tag" >&2; exit 1; }
            gh release view "$tag" --json tagName > /dev/null
            tagged_sha=$(git rev-parse --verify "$tag^{commit}")
            if [ -z "$REQUESTED_TAG" ] && [ "$tagged_sha" != "$sha" ]; then
              echo "Release tag and Release Please source do not agree" >&2
              exit 1
            fi
            sha="$tagged_sha"
            git merge-base --is-ancestor "$sha" origin/main
            version="${tag#v}"
          fi
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "edge=$edge"
            echo "aliases=$aliases"
          } >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    # Resolve deployment credentials directly in this environment-bound job.
    environment: release
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [init, migrate, web, ingress]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Check release version and registry credentials
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "Set DOCKER_USERNAME and DOCKER_PASSWORD secrets in the release environment" >&2
            exit 1
          fi
          node -e 'const version = process.env.RELEASE_VERSION; if (version && (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || require("./package.json").version !== version)) throw new Error("Release version must match package.json")'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the Dockyard registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: cr.guneet.dev
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Image tags and OCI metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: cr.guneet.dev/dockyard/${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable=${{ needs.prepare.outputs.edge == 'true' }}
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.aliases == 'true' && needs.prepare.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.aliases == 'true' && needs.prepare.outputs.version != '' && !startsWith(needs.prepare.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.aliases == 'true' && needs.prepare.outputs.version != '' }}
          labels: |
            org.opencontainers.image.title=Dockyard ${{ matrix.target }}
      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dockyard-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=dockyard-${{ matrix.target }}
          provenance: mode=min
          sbom: true
      - name: Record the published digest
        env:
          IMAGE: cr.guneet.dev/dockyard/${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $IMAGE"
            echo "Digest: \`$DIGEST\`"
            echo '```text'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
