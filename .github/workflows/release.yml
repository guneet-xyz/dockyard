name: Release and publish

# No manual trigger: images are published only from main after full CI. Recover
# a failed publication with "Re-run failed jobs" (see docs/releases.md).
on:
  push:
    branches: [main]

permissions:
  contents: read

# Do not cancel a publication halfway through the four-image release.
concurrency:
  group: dockyard-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'guneet-xyz/dockyard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      edge: ${{ steps.source.outputs.edge }}
    steps:
      - name: Maintain the conventional-commit release PR and create merged releases
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows. Explicit
      # workflow_dispatch does trigger CI, without requiring a third/PAT secret.
      - name: Dispatch quality checks for the generated release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          branch=$(node -e 'const prs = JSON.parse(process.env.RELEASE_PRS); if (prs.length !== 1 || !prs[0].headBranchName) throw new Error("Expected one release PR"); console.log(prs[0].headBranchName)')
          gh workflow run ci.yml --ref "$branch"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the exact source commit and publication tags
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="$SOURCE_SHA"
          version=""
          edge=true
          if [ "$RELEASE_CREATED" = true ]; then
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Expected a stable vMAJOR.MINOR.PATCH release tag" >&2; exit 1; }
            gh release view "$RELEASE_TAG" --json tagName > /dev/null
            tagged_sha=$(git rev-parse --verify "$RELEASE_TAG^{commit}")
            if [ "$tagged_sha" != "$RELEASE_SHA" ]; then
              echo "Release tag and Release Please source do not agree" >&2
              exit 1
            fi
            git merge-base --is-ancestor "$tagged_sha" origin/main
            sha="$tagged_sha"
            version="${RELEASE_TAG#v}"
            # Release Please may find a merged release older than this push.
            # Never label that older source as the current main development build.
            if [ "$sha" != "$SOURCE_SHA" ]; then edge=false; fi
          fi
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "edge=$edge"
          } >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # Each target and platform is built on a native runner and pushed by digest
  # only. No tag exists until the smoke tests below pass on both platforms.
  build:
    name: Build ${{ matrix.target }} (${{ matrix.platform }})
    needs: [prepare, checks]
    runs-on: ${{ matrix.runner }}
    # Resolve deployment credentials directly in this environment-bound job.
    environment: release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [init, migrate, web, ingress]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Check release version and registry credentials
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "Set DOCKER_USERNAME and DOCKER_PASSWORD secrets in the release environment" >&2
            exit 1
          fi
          node -e 'const version = process.env.RELEASE_VERSION; if (version && (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) || require("./package.json").version !== version)) throw new Error("Release version must match package.json")'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the Dockyard registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: cr.guneet.dev
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # This read-only token check avoids building when login works but push
      # permission is absent. No test blobs or manifests are uploaded.
      - name: Verify scoped registry permissions
        env:
          TARGET: ${{ matrix.target }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const registry = new URL("https://cr.guneet.dev")
          const target = process.env.TARGET
          if (!["init", "migrate", "web", "ingress"].includes(target)) throw new Error("Unknown publishing target")
          const challenge = await fetch(new URL("/v2/", registry))
          const authenticate = challenge.headers.get("www-authenticate") ?? ""
          const realm = /realm="([^"]+)"/.exec(authenticate)?.[1]
          const service = /service="([^"]+)"/.exec(authenticate)?.[1]
          if (challenge.status !== 401 || !realm || !service) throw new Error("Expected a registry bearer authentication challenge")
          const tokenUrl = new URL(realm)
          if (tokenUrl.origin !== registry.origin) throw new Error("Refusing to forward credentials outside the registry origin")
          const repository = `dockyard/${target}`
          tokenUrl.searchParams.set("service", service)
          tokenUrl.searchParams.set("scope", `repository:${repository}:pull,push`)
          const response = await fetch(tokenUrl, { headers: { Authorization: `Basic ${Buffer.from(`${process.env.DOCKER_USERNAME}:${process.env.DOCKER_PASSWORD}`).toString("base64")}` } })
          if (!response.ok) throw new Error(`Registry token request failed (${response.status}); check the key and its owner`)
          const data = await response.json()
          let claims
          try { claims = JSON.parse(Buffer.from((data.token ?? data.access_token).split(".")[1], "base64url").toString()) }
          catch { throw new Error("Unexpected registry token response") }
          const granted = claims.access?.find((entry) => entry.type === "repository" && entry.name === repository)?.actions ?? []
          if (!["pull", "push"].every((action) => granted.includes(action))) throw new Error(`Registry credential lacks pull + push on ${repository} (granted: ${granted.join(", ") || "none"}). Use an enabled maintainer/admin-owned key with a dockyard project pull + push grant.`)
          console.log(`Verified pull + push permission for ${repository}`)
          NODE
      # The publish job applies exactly these tags after the smoke tests pass.
      - name: Image tags and OCI metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Release checkouts intentionally use a detached exact SHA. Keep
          # workflow context and supply source-derived metadata explicitly.
          context: workflow
          images: cr.guneet.dev/dockyard/${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ needs.prepare.outputs.sha }},priority=100
            type=raw,value=edge,enable=${{ needs.prepare.outputs.edge == 'true' }}
            type=semver,pattern=v{{version}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.version != '' }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.version != '' }}
            type=semver,pattern=v{{major}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.version != '' && !startsWith(needs.prepare.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.version != '' }}
          labels: |
            org.opencontainers.image.title=Dockyard ${{ matrix.target }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=cr.guneet.dev/dockyard/${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=dockyard-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dockyard-${{ matrix.target }}-${{ matrix.arch }}
          provenance: mode=min
          sbom: true
      - name: Record the pushed digest and planned tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          OUTPUT: ${{ runner.temp }}/image
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Unexpected image digest" >&2; exit 1; }
          mkdir -p "$OUTPUT"
          printf '%s\n' "$DIGEST" > "$OUTPUT/digest"
          printf '%s\n' "$TAGS" | sed '/^$/d' > "$OUTPUT/tags"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          overwrite: true

  # Start the four exact pushed images together on each native platform.
  smoke:
    name: Smoke-test ${{ matrix.platform }} images
    needs: [prepare, build]
    runs-on: ${{ matrix.runner }}
    # Registry credentials are used only to pull the pushed digests.
    environment: release
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*-${{ matrix.arch }}
          path: ${{ runner.temp }}/images
      - name: Pull the exact pushed images
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          IMAGES: ${{ runner.temp }}/images
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          # Keep the registry login out of later steps that run test tooling.
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/registry-auth.XXXXXX")
          export DOCKER_CONFIG
          trap 'docker logout cr.guneet.dev > /dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$DOCKER_PASSWORD" | docker login cr.guneet.dev --username "$DOCKER_USERNAME" --password-stdin
          for target in init migrate web ingress; do
            digest=$(cat "$IMAGES/image-$target-$ARCH/digest")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Unexpected $target digest" >&2; exit 1; }
            image="cr.guneet.dev/dockyard/$target@$digest"
            docker pull --platform "$PLATFORM" "$image"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "$PLATFORM"
            # A local-only name; the Compose stack below never pulls Dockyard images.
            docker tag "$image" "localhost/dockyard-smoke/$target:$ARCH"
            echo "$target: $image" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Configure Compose to use the pulled images
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sh deploy/generate-env.sh
          sed -i \
            -e 's|^DOCKYARD_IMAGE_PREFIX=.*|DOCKYARD_IMAGE_PREFIX=localhost/dockyard-smoke|' \
            -e "s|^DOCKYARD_IMAGE_TAG=.*|DOCKYARD_IMAGE_TAG=$ARCH|" \
            .env
          docker compose --env-file .env -f deploy/compose.yaml pull postgres registry
      - name: Start the Compose stack
        run: docker compose --env-file .env -f deploy/compose.yaml up --pull never --wait --wait-timeout 240
      - name: Verify initialization and migration jobs
        run: scripts/ci/verify-services.sh
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Registry integration
        run: |
          set -a
          . ./.env
          set +a
          TEST_ADMIN_PASSWORD="$ADMIN_PASSWORD" pnpm test:integration
      - name: Docker CLI through ingress
        run: scripts/ci/docker-cli.sh
      - name: Service logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deploy/compose.yaml logs --no-color
          fi
      - name: Stop test services
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deploy/compose.yaml down
          fi

  publish:
    name: Tag ${{ matrix.target }}
    needs: [prepare, smoke]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [init, migrate, web, ingress]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ matrix.target }}-*
          path: ${{ runner.temp }}/images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the Dockyard registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: cr.guneet.dev
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Tag the tested multi-architecture image
        env:
          IMAGE: cr.guneet.dev/dockyard/${{ matrix.target }}
          IMAGES: ${{ runner.temp }}/images/image-${{ matrix.target }}
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "$IMAGES-$arch/digest")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Unexpected $arch digest" >&2; exit 1; }
            sources+=("$IMAGE@$digest")
          done
          cmp "$IMAGES-amd64/tags" "$IMAGES-arm64/tags"
          mapfile -t tags < "$IMAGES-amd64/tags"
          [ "${#tags[@]}" -gt 0 ] || { echo "No tags to publish" >&2; exit 1; }
          arguments=()
          for tag in "${tags[@]}"; do
            name=${tag#"$IMAGE:"}
            [[ "$tag" == "$IMAGE:$name" && "$name" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "Unexpected tag $tag" >&2; exit 1; }
            arguments+=(--tag "$tag")
          done
          docker buildx imagetools create "${arguments[@]}" "${sources[@]}"
          docker buildx imagetools inspect --raw "${tags[0]}" | jq --exit-status '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${tags[0]}" | jq --raw-output .digest)
          {
            echo "### $IMAGE"
            echo "Digest: \`$digest\`"
            echo '```text'
            printf '%s\n' "${tags[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
