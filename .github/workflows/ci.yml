name: Quality and integration

on:
  push:
    branches-ignore: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate before publication
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate GitHub Actions workflows
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - run: pnpm env:generate
      - run: docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.build.yaml up --build --wait --wait-timeout 240
      - name: Verify initialization and migration jobs
        run: |
          for service in init migrate; do
            container=$(docker compose --env-file .env -f deploy/compose.yaml ps --all --quiet "$service")
            test "$(docker inspect --format '{{.State.Status}}' "$container")" = exited
            test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
          done
          docker compose --env-file .env -f deploy/compose.yaml exec -T web sh -c 'test ! -e dist/migrate.cjs && test ! -d drizzle && test -z "$ADMIN_PASSWORD"'
          for service in web registry; do
            container=$(docker compose --env-file .env -f deploy/compose.yaml ps --quiet "$service")
            test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$container")" = 0
          done
          container=$(docker compose --env-file .env -f deploy/compose.yaml ps --quiet ingress)
          test "$(docker inspect --format '{{len .Mounts}}' "$container")" = 0
      - name: Registry integration
        run: |
          set -a
          . ./.env
          set +a
          TEST_ADMIN_PASSWORD="$ADMIN_PASSWORD" pnpm test:integration
      - name: Docker CLI through ingress
        run: |
          set -a
          . ./.env
          set +a
          registry=$(node -e 'console.log(new URL(process.env.APP_URL).host)')
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/dockyard-docker.XXXXXX")
          export DOCKER_CONFIG
          printf '%s' "$ADMIN_PASSWORD" | docker login "$registry" --username "$ADMIN_USERNAME" --password-stdin
          docker pull alpine:3.23
          docker tag alpine:3.23 "$registry/ci/alpine:3.23"
          docker push "$registry/ci/alpine:3.23"
          docker logout "$registry"
          docker pull "$registry/ci/alpine:3.23"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: |
          set -a
          . ./.env
          set +a
          TEST_ADMIN_PASSWORD="$ADMIN_PASSWORD" pnpm test:e2e
      - name: Service logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml logs --no-color
      - name: Stop test services
        if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml down
