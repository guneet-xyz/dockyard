name: Quality and integration

on:
  push:
    branches-ignore: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate before publication
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate GitHub Actions workflows
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - run: pnpm env:generate
      - run: docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.build.yaml up --build --wait --wait-timeout 240
      - name: Verify initialization and migration jobs
        run: scripts/ci/verify-services.sh
      - name: Registry integration
        run: |
          set -a
          . ./.env
          set +a
          TEST_ADMIN_PASSWORD="$ADMIN_PASSWORD" pnpm test:integration
      - name: Docker CLI through ingress
        run: scripts/ci/docker-cli.sh
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: |
          set -a
          . ./.env
          set +a
          TEST_ADMIN_PASSWORD="$ADMIN_PASSWORD" pnpm test:e2e
      - name: Service logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deploy/compose.yaml logs --no-color
          fi
      - name: Stop test services
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deploy/compose.yaml down
          fi
